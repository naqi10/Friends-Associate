name: faryk

# Optional local PostgreSQL for testing the production database engine.
#   docker compose up -d
#   DATABASE_URL="postgresql://faryk:faryk_local_only@localhost:5434/faryk?schema=public"
# Data persists in the named volume until `docker compose down -v`.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: faryk
      POSTGRES_PASSWORD: faryk_local_only
      POSTGRES_DB: faryk
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - faryk-pg:/var/lib/postgresql/data

volumes:
  faryk-pg:
